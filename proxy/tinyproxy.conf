Port 8888
Listen 0.0.0.0
Timeout 600

LogLevel Notice

MaxClients 200

# Which clients are served is decided at start: the entrypoint appends one
# `Allow <subnet>` per entry in ALLOW_FROM, which `ralph` sets to the sandbox
# network. Nothing here, so a proxy started without it serves nobody unless
# the entrypoint says otherwise.

# Deny-by-default: a destination is refused unless it matches a line in the
# allowlist. FilterType must be `ere` (extended regex) -- `fqdn` is not
# supported by tinyproxy 1.11.x, which is what Alpine ships.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes
FilterCaseSensitive No

# CONNECT is limited to TLS. Without this, the proxy would tunnel arbitrary
# TCP to any port on an allowlisted host.
ConnectPort 443

ViaProxyName "ralph"
