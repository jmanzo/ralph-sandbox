Port 8888
Listen 0.0.0.0
Timeout 600

LogLevel Notice

MaxClients 200

# Only reachable from the internal sandbox network.
Allow 0.0.0.0/0

# Deny-by-default: a destination is refused unless it matches a line in the
# allowlist. FilterType must be `ere` (extended regex) -- `fqdn` is not
# supported by tinyproxy 1.11.x, which is what Alpine ships.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes
FilterCaseSensitive No

# CONNECT is limited to TLS. Without this, the proxy would tunnel arbitrary
# TCP to any port on an allowlisted host.
ConnectPort 443

ViaProxyName "ralph"
