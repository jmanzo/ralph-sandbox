version: 2
updates:
  # Actions are pinned by commit SHA in ci.yml; this keeps the pins moving
  # and the version comment next to each one accurate.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Base image digests for the sandbox and the proxy.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
