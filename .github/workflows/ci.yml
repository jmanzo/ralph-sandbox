name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck ralph install.sh yolo-run.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ralph-sandbox .
      - name: Verify sandbox
        run: |
          docker run --rm ralph-sandbox bash -lc '
            set -e
            test "$(id -u)" = 1000
            test "$(whoami)" = sandboxuser
            node --version
            claude --version
            git --version
            rg --version >/dev/null
          '
      - name: Yolo mode must refuse to run as root
        run: |
          out=$(docker run --rm --user root -e HOME=/root ralph-sandbox \
                  bash -lc 'claude --dangerously-skip-permissions -p hi 2>&1' || true)
          echo "$out"
          echo "$out" | grep -q "cannot be used with root"
