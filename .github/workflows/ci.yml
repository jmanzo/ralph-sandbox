name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck ralph install.sh yolo-run.sh entrypoint.sh loop.sh

  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scaffolding lands, and each role carries its model
        run: |
          mkdir -p /tmp/lp && cd /tmp/lp
          git init -q . && git config user.email t@t && git config user.name t
          "$GITHUB_WORKSPACE/ralph" init
          test -f PRD.md && test -f .ralph/PROMPT.md && test -f PROPOSALS.md
          "$GITHUB_WORKSPACE/ralph" model | tee /tmp/models
          grep -qE '^orchestrator +haiku'  /tmp/models
          grep -qE '^architect +sonnet'    /tmp/models
          grep -qE '^developer +opus'      /tmp/models
          grep -qE '^qa +sonnet'           /tmp/models

      - name: Escalating and degrading a role is one command
        run: |
          cd /tmp/lp
          "$GITHUB_WORKSPACE/ralph" model developer sonnet
          "$GITHUB_WORKSPACE/ralph" model | grep -qE '^developer +sonnet'
          "$GITHUB_WORKSPACE/ralph" model developer opus
          "$GITHUB_WORKSPACE/ralph" model | grep -qE '^developer +opus'
          # the orchestrator is an env var, not a file, and says so
          ! "$GITHUB_WORKSPACE/ralph" model orchestrator haiku 2>/dev/null

      - name: The same failure three times halts the run and writes an alert
        run: |
          cd /tmp/lp
          git add -A && git commit -qm init
          cat > agent <<'AGENT'
          #!/usr/bin/env bash
          n=$(( $(cat .n 2>/dev/null || echo 0) + 1 )); echo "$n" > .n
          echo "entry $n" >> .ralph/progress.md
          git add -A >/dev/null 2>&1; git commit -qm "iter $n" >/dev/null 2>&1
          printf '%s\n' '{"type":"result","subtype":"success","num_turns":1,"total_cost_usd":0.10,"result":"stuck\n<blocked>npm test: expected 401, received 500</blocked>"}'
          AGENT
          chmod +x agent
          rc=0
          RALPH_AGENT_CMD=$PWD/agent RALPH_PROJECT=/tmp/lp \
            bash "$GITHUB_WORKSPACE/loop.sh" 10 || rc=$?
          echo "exit=$rc"
          test "$rc" = 4
          cat .ralph/alert.txt
          grep -q "stuck on one failure" .ralph/alert.txt
          python3 -c "
          import json
          d = json.load(open('.ralph/alert.json'))
          assert d['exit'] == 4 and d['iterations'] == 3, d
          print('alert json ok:', d['reason'])"

      - name: A different failure each time does not halt the run
        run: |
          cd /tmp/lp && rm -f .n
          cat > agent <<'AGENT'
          #!/usr/bin/env bash
          n=$(( $(cat .n 2>/dev/null || echo 0) + 1 )); echo "$n" > .n
          echo "entry $n" >> .ralph/progress.md
          git add -A >/dev/null 2>&1; git commit -qm "iter $n" >/dev/null 2>&1
          printf '%s\n' "{\"type\":\"result\",\"subtype\":\"success\",\"num_turns\":1,\"total_cost_usd\":0.10,\"result\":\"<blocked>failure number $n</blocked>\"}"
          AGENT
          chmod +x agent
          rc=0
          RALPH_AGENT_CMD=$PWD/agent RALPH_PROJECT=/tmp/lp \
            bash "$GITHUB_WORKSPACE/loop.sh" 4 || rc=$?
          test "$rc" = 3   # ran out of budget, i.e. it kept going

      - name: With no cap, the run continues until the PRD is done
        run: |
          cd /tmp/lp && rm -f .n
          cat > agent <<'AGENT'
          #!/usr/bin/env bash
          n=$(( $(cat .n 2>/dev/null || echo 0) + 1 )); echo "$n" > .n
          echo "entry $n" >> .ralph/progress.md
          git add -A >/dev/null 2>&1; git commit -qm "iter $n" >/dev/null 2>&1
          if [ "$n" -ge 7 ]; then done='\n<promise>COMPLETE</promise>'; else done=''; fi
          printf '%s\n' "{\"type\":\"result\",\"subtype\":\"success\",\"num_turns\":1,\"total_cost_usd\":0.50,\"result\":\"task $n$done\"}"
          AGENT
          chmod +x agent
          # no iteration argument at all
          RALPH_AGENT_CMD=$PWD/agent RALPH_PROJECT=/tmp/lp bash "$GITHUB_WORKSPACE/loop.sh"
          python3 -c "
          import json
          d = json.load(open('.ralph/alert.json'))
          assert d['exit'] == 0 and d['iterations'] == 7, d
          print('ran uncapped to completion in', d['iterations'], 'iterations')"

      - name: A spend ceiling stops an uncapped run
        run: |
          cd /tmp/lp && rm -f .n
          rc=0
          RALPH_AGENT_CMD=$PWD/agent RALPH_PROJECT=/tmp/lp RALPH_LOOP_MAX_COST=2 \
            bash "$GITHUB_WORKSPACE/loop.sh" || rc=$?
          test "$rc" = 5
          grep -q "spend ceiling" .ralph/alert.txt

      - name: The completion sigil ends the run
        run: |
          cd /tmp/lp && rm -f .n
          cat > agent <<'AGENT'
          #!/usr/bin/env bash
          printf '%s\n' '{"type":"result","subtype":"success","num_turns":1,"total_cost_usd":0.10,"result":"done\n<promise>COMPLETE</promise>"}'
          AGENT
          chmod +x agent
          RALPH_AGENT_CMD=$PWD/agent RALPH_PROJECT=/tmp/lp bash "$GITHUB_WORKSPACE/loop.sh" 5
          grep -q "finished the PRD" .ralph/alert.txt

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: ./ralph build

      - name: Sandbox is a non-root user with the expected toolchain
        run: |
          docker run --rm ralph-sandbox bash -lc '
            set -e
            # On Linux the sandbox is built with the uid of whoever ran
            # the build, so the guarantee is non-root, not a fixed number.
            # Keep apostrophes out of this script: it is single-quoted.
            test "$(id -u)" != 0
            test "$(whoami)" = sandboxuser
            node --version && claude --version && git --version
            rg --version >/dev/null && rsync --version >/dev/null
          '

      - name: Yolo mode must refuse to run as root
        run: |
          out=$(docker run --rm --user root -e HOME=/root ralph-sandbox \
                  bash -lc 'claude --dangerously-skip-permissions -p hi 2>&1' || true)
          echo "$out"
          echo "$out" | grep -q "cannot be used with root"

      - name: Egress policy allows the allowlist and denies everything else
        run: |
          ./ralph proxy up
          ./ralph policy test api.anthropic.com | tee /tmp/a
          grep -q "allowed" /tmp/a
          ./ralph policy test pastebin.com | tee /tmp/b
          grep -q "BLOCKED" /tmp/b

      - name: Egress is blocked at the route level, not just DNS
        run: |
          # A raw IP bypasses DNS entirely; the internal network must still
          # have no way out.
          docker run --rm --network ralph-internal ralph-sandbox \
            curl -s -o /dev/null --max-time 8 https://1.1.1.1 \
            && { echo "raw-IP egress succeeded, policy is broken"; exit 1; } \
            || echo "raw-IP egress blocked"

      - name: Git works in the sandbox even with a host gitconfig mounted
        run: |
          # A mounted ~/.gitconfig must not shadow the safe.directory rules, or
          # every git command in the sandbox dies of "dubious ownership".
          rm -rf /tmp/gitproj && mkdir -p /tmp/gitproj && cd /tmp/gitproj
          git init -q . && git config user.email t@t && git config user.name t
          echo hello > f.txt && git add -A && git commit -qm first
          printf '[user]\n\tname = Host User\n\temail = host@example.com\n' > /tmp/hostgitconfig
          out=$(docker run --rm -v /tmp/gitproj:/workspace \
                  -v /tmp/hostgitconfig:/home/sandboxuser/.gitconfig:ro \
                  ralph-sandbox bash -lc '
                    git rev-parse --git-dir >/dev/null || exit 1
                    git commit --allow-empty -qm from-sandbox || exit 1
                    echo GIT-OK' 2>&1)
          echo "$out"
          echo "$out" | grep -q GIT-OK

      - name: The loop driver is installed and validates its inputs
        run: |
          out=$(docker run --rm ralph-sandbox bash -lc 'ralph-loop 3 2>&1' || true)
          echo "$out"
          echo "$out" | grep -q "run 'ralph init'"
          out=$(docker run --rm ralph-sandbox bash -lc 'ralph-loop abc 2>&1' || true)
          echo "$out" | grep -q "must be a number"

      - name: Slack, Discord and Telegram each get the end-of-run message
        run: |
          cat > /tmp/hook.py <<'PYEOF'
          import http.server, sys, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers["Content-Length"]))
                  with open("/tmp/hooks.jsonl", "a") as f:
                      f.write(json.dumps({"path": self.path, "body": json.loads(body)}) + "\n")
                  self.send_response(200); self.end_headers(); self.wfile.write(b'{"ok":true}')
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", 8900), H).serve_forever()
          PYEOF
          rm -f /tmp/hooks.jsonl && touch /tmp/hooks.jsonl
          # Detach its output, or anything capturing this step's stdout waits
          # on a pipe the server keeps open.
          python3 /tmp/hook.py >/dev/null 2>&1 &
          HOOK=$!
          trap 'kill "$HOOK" 2>/dev/null || true' EXIT
          sleep 2

          rm -rf /tmp/np && mkdir -p /tmp/np && cd /tmp/np
          git init -q . && git config user.email t@t && git config user.name t
          "$GITHUB_WORKSPACE/ralph" init >/dev/null
          cat > agent <<'AGENT'
          #!/usr/bin/env bash
          printf '%s\n' '{"type":"result","subtype":"success","num_turns":1,"total_cost_usd":0.10,"result":"done\n<promise>COMPLETE</promise>"}'
          AGENT
          chmod +x agent
          git add -A && git commit -qm init

          # The notification is posted by the HOST, so 127.0.0.1 is reachable
          # even though the sandbox itself has no route to it.
          RALPH_WORKSPACE=/tmp/np RALPH_NETWORK_POLICY=off RALPH_AGENT_CMD=/workspace/agent \
            RALPH_SLACK_WEBHOOK=http://127.0.0.1:8900/slack \
            RALPH_DISCORD_WEBHOOK=http://127.0.0.1:8900/discord \
            RALPH_TELEGRAM_TOKEN=123:ABC RALPH_TELEGRAM_CHAT=-100999 \
            RALPH_TELEGRAM_API=http://127.0.0.1:8900 \
            "$GITHUB_WORKSPACE/ralph" loop
          sleep 2
          cat /tmp/hooks.jsonl
          python3 -c "
          import json
          rows = [json.loads(l) for l in open('/tmp/hooks.jsonl')]
          paths = sorted(r['path'] for r in rows)
          assert paths == ['/bot123:ABC/sendMessage', '/discord', '/slack'], paths
          by = {r['path']: r['body'] for r in rows}
          assert 'text' in by['/slack']
          assert 'content' in by['/discord']
          assert by['/bot123:ABC/sendMessage']['chat_id'] == '-100999'
          assert all('finished the PRD' in json.dumps(b) for b in by.values())
          print('all three channels delivered')"

      - name: A webhook is never reachable from inside the sandbox
        run: |
          # The egress policy is what makes host-side posting worth the bother.
          ./ralph proxy up
          ./ralph policy test hooks.slack.com | tee /tmp/p
          grep -q "BLOCKED" /tmp/p
          ./ralph policy test api.telegram.org | tee /tmp/q
          grep -q "BLOCKED" /tmp/q

      - name: Host Docker socket is never exposed
        run: |
          docker run --rm ralph-sandbox bash -lc '
            test ! -e /var/run/docker.sock || { echo "socket exposed"; exit 1; }
          '

      - name: Hardened mode drops all capabilities
        run: |
          caps=$(docker run --rm --cap-drop ALL --security-opt no-new-privileges \
                   ralph-sandbox bash -lc 'grep CapEff /proc/self/status')
          echo "$caps"
          echo "$caps" | grep -q "0000000000000000"

      - name: Clone mode keeps the host workspace read-only
        run: |
          mkdir -p /tmp/proj && echo original > /tmp/proj/file.txt
          out=$(RALPH_MODE=clone RALPH_WORKSPACE=/tmp/proj RALPH_NETWORK_POLICY=off \
                  ./ralph shell -lc 'touch /run/sandbox/source/hack 2>&1 || true')
          echo "$out"
          echo "$out" | grep -qi "read-only"
          test "$(cat /tmp/proj/file.txt)" = original

      - name: Snapshots survive deletion of the whole workspace
        run: |
          rm -rf /tmp/snap && mkdir -p /tmp/snap && cd /tmp/snap
          git init -q . && git config user.email t@t && git config user.name t
          echo v1 > app.txt && git add -A && git commit -qm first
          echo uncommitted >> app.txt && echo draft > untracked.txt
          before=$(git status --short)

          RALPH_WORKSPACE=/tmp/snap RALPH_NETWORK_POLICY=off \
            "$GITHUB_WORKSPACE/ralph" shell -lc 'rm -rf /workspace/.git /workspace/*'

          test ! -e /tmp/snap/app.txt
          yes | RALPH_WORKSPACE=/tmp/snap "$GITHUB_WORKSPACE/ralph" snapshot restore

          after=$(git status --short)
          echo "before: $before"
          echo "after:  $after"
          test "$before" = "$after"
          test "$(git log --oneline | wc -l)" = 1
